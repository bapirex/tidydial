name: Release

# Builds the signed APK and AAB for a version tag, publishes them as a GitHub Release, and
# uploads the AAB to Google Play's internal track. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds the signing and Play secrets; needs the maintainer's approval and only deploys tags.
    environment: release
    permissions:
      contents: write # create the GitHub Release
    env:
      TAG: ${{ github.ref_name }}
      # Secrets cannot be used in step conditions directly.
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # SHA-256 of the release signing certificate (lowercase hex, no colons). The build fails
      # if the APK is signed with any other key, which would break updates on both stores.
      EXPECTED_CERT_SHA256: 045e61f694580b2833a6be81f432741b264685bdcef6a1a792580a786a787e5c

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # No Gradle cache: release builds start clean, so nothing from earlier runs can leak in.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Read version
        run: |
          version_name=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          version_code=$(sed -nE 's/^ *versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          # v1.2.3 or a pre-release such as v1.2.3-rc1 must match versionName 1.2.3.
          tag_version="${TAG#v}"
          if [ "${tag_version%%-*}" != "$version_name" ]; then
            echo "::error::Tag $TAG does not match versionName $version_name"
            exit 1
          fi
          changelog="fastlane/metadata/android/en-US/changelogs/$version_code.txt"
          if [ ! -f "$changelog" ]; then
            echo "::error::Missing $changelog"
            exit 1
          fi
          # Google Play and F-Droid both cap release notes at 500 characters.
          length=$(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read().strip()))' "$changelog")
          if [ "$length" -gt 500 ]; then
            echo "::error::$changelog is $length characters; the limit is 500"
            exit 1
          fi
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          {
            echo "VERSION_NAME=$version_name"
            echo "VERSION_CODE=$version_code"
            echo "CHANGELOG=$changelog"
            echo "PRERELEASE=$prerelease"
          } >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          TIDYDIAL_KEYSTORE_BASE64: ${{ secrets.TIDYDIAL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TIDYDIAL_KEYSTORE_BASE64" ]; then
            echo "::error::Secret TIDYDIAL_KEYSTORE_BASE64 is not set in the release environment"
            exit 1
          fi
          keystore="$RUNNER_TEMP/tidydial-release.jks"
          printf '%s' "$TIDYDIAL_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "TIDYDIAL_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        env:
          TIDYDIAL_KEYSTORE_PASSWORD: ${{ secrets.TIDYDIAL_KEYSTORE_PASSWORD }}
          TIDYDIAL_KEY_ALIAS: ${{ secrets.TIDYDIAL_KEY_ALIAS }}
          TIDYDIAL_KEY_PASSWORD: ${{ secrets.TIDYDIAL_KEY_PASSWORD }}
        run: |
          for name in TIDYDIAL_KEYSTORE_PASSWORD TIDYDIAL_KEY_ALIAS TIDYDIAL_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the release environment"
              exit 1
            fi
          done
          ./gradlew assembleRelease bundleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tidydial-release.jks"

      - name: Verify signatures and rename outputs
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab

          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt
          # Depending on the build-tools version and flags, signers are printed as
          # "Signer #1 certificate SHA-256 digest: …" or "V2 Signer: certificate SHA-256 digest: …".
          # Every signer, in every scheme, must be the release certificate.
          apk_certs=$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' apksigner.txt | awk '{print $NF}' | sort -u)
          if [ "$apk_certs" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signer certificate(s) [${apk_certs//$'\n'/, }] do not match $EXPECTED_CERT_SHA256"
            exit 1
          fi
          aab_cert=$(keytool -printcert -jarfile "$aab" | sed -n 's/^.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' | sort -u)
          if [ "$aab_cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::AAB is signed with certificate [${aab_cert//$'\n'/, }], expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          jarsigner_output=$(jarsigner -verify "$aab")
          if ! grep -q '^jar verified' <<< "$jarsigner_output"; then
            echo "$jarsigner_output"
            echo "::error::AAB signature does not verify"
            exit 1
          fi

          mkdir -p dist
          cp "$apk" "dist/tidydial-$VERSION_NAME.apk"
          cp "$aab" "dist/tidydial-$VERSION_NAME.aab"
          (cd dist && sha256sum tidydial-* > SHA256SUMS && cat SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run of this workflow: replace the assets of the existing release.
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "TidyDial $VERSION_NAME" \
              --notes-file "$CHANGELOG" \
              "${flags[@]}"
          fi

      - name: Prepare Play release notes
        if: env.HAS_PLAY_CREDENTIALS == 'true' && env.PRERELEASE == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          cp "$CHANGELOG" "$RUNNER_TEMP/whatsnew/whatsnew-en-US"

      # Pre-release tags (v1.2.3-rc1) reuse the final versionCode, which Play accepts only
      # once, so only final tags go to Play. Skipped until PLAY_SERVICE_ACCOUNT_JSON is set.
      - name: Upload to Google Play (internal track)
        if: env.HAS_PLAY_CREDENTIALS == 'true' && env.PRERELEASE == 'false'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.tidydial
          releaseFiles: dist/tidydial-${{ env.VERSION_NAME }}.aab
          track: internal
          # Play accepts only draft releases until the app has been published once; set the
          # PLAY_RELEASE_STATUS variable on the release environment to "completed" after that.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
