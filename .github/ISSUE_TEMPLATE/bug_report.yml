name: Bug report
description: Something in TidyDial does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Please use fake phone numbers only.** Replace real digits with fake ones that show the
        same behavior (for example `+1 212-555-0123`). Never share real contact data.

        To report a security problem, do not use this form: see [SECURITY.md](https://github.com/bapirex/tidydial/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set the country to ...
        2. Choose the ... format
        3. ...
    validations:
      required: true
  - type: input
    id: sample-number
    attributes:
      label: Sample number (fake digits)
      description: A number that shows the problem, as it is stored in the contact. Use fake digits that behave the same way.
      placeholder: "+1 212-555-0123"
  - type: input
    id: result
    attributes:
      label: Result shown by TidyDial
      description: What TidyDial suggested or wrote for that number, and what you expected.
      placeholder: "Got: ...  Expected: ..."
  - type: input
    id: country
    attributes:
      label: Selected country
      placeholder: United States
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Selected format
      options:
        - International
        - National
        - E.164
        - RFC 3966
        - Not relevant
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: TidyDial version
      description: Shown at the top of the About sheet (menu > About).
      placeholder: "1.0.0 (1)"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - Google Play
        - F-Droid
        - GitHub release
        - Built from source
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: Android 16
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Manufacturer and model
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or other details. Make sure no real names or numbers are visible.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real phone numbers, names or other personal data.
          required: true
