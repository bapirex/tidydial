name: Feature request
description: Suggest an idea or improvement for TidyDial.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. TidyDial stays fully offline and asks for no permissions
        besides contacts, so ideas that need network access, accounts or tracking are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, examples or links. Use fake phone numbers only.
